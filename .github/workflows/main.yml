name: Build AlphaXK APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Generate Android Project Files
        run: |
          mkdir -p android-app/app/src/main/java/com/alphaxk/pubgtool
          mkdir -p android-app/app/src/main/res/layout
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/mipmap-anydpi-v26

          # 1. Root settings.gradle
          cat << 'EOF' > android-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AlphaXKTool"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > android-app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > android-app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # 4. App build.gradle
          cat << 'EOF' > android-app/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.alphaxk.pubgtool'
              compileSdk 34
              defaultConfig {
                  applicationId "com.alphaxk.pubgtool"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. proguard-rules.pro
          echo "-keep class com.alphaxk.pubgtool.** { *; }" > android-app/app/proguard-rules.pro

          # 6. AndroidManifest.xml
          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AlphaXK">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Floating control panel" />
                  </service>
                  <receiver android:name=".ConfigReceiver" android:exported="false">
                      <intent-filter>
                          <action android:name="com.alphaxk.pubgtool.CONFIG_CHANGED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 7. strings.xml (Arabic)
          cat << 'EOF' > android-app/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">أداة ألفا XK</string>
              <string name="status_granted">صلاحية العرض فوق التطبيقات: ممنوحة</string>
              <string name="status_denied">صلاحية العرض: مرفوضة — اضغط على زر المنح</string>
              <string name="btn_grant">منح صلاحية العرض</string>
              <string name="btn_start">تشغيل القائمة العائمة</string>
              <string name="btn_stop">إيقاف القائمة العائمة</string>
              <string name="bubble_desc">القائمة العائمة</string>
              <string name="menu_title">ألفا XK</string>
              <string name="label_opacity">الشفافية: %1$d%%</string>
              <string name="label_fov">زاوية التصويب: %1$.1f°</string>
              <string name="label_smoothing">التمليس: %1$d%%</string>
              <string name="switch_esp">عرض اللاعبين (ESP)</string>
              <string name="switch_aimbot">التصويب التلقائي</string>
              <string name="target_head">الهدف: الرأس</string>
              <string name="target_chest">الهدف: الصدر</string>
              <string name="section_aim">إعدادات التصويب</string>
              <string name="section_visual">الإعدادات البصرية</string>
              <string name="section_target">هدف التصويب</string>
              <string name="notif_channel_name">خدمة القائمة العائمة</string>
              <string name="notif_channel_desc">تبقي القائمة نشطة</string>
              <string name="notif_title">أداة ألفا XK</string>
              <string name="notif_text">القائمة العائمة نشطة</string>
              <string name="msg_service_started">تم التشغيل</string>
              <string name="msg_service_stopped">تم الإيقاف</string>
              <string name="msg_no_permission">يجب منح الصلاحية أولاً</string>
          </resources>
          EOF

          # 8. styles.xml
          cat << 'EOF' > android-app/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AlphaXK" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">#FF0D0D1A</item>
                  <item name="android:statusBarColor">#FF0D0D1A</item>
              </style>
          </resources>
          EOF

          # 9. menu_bg.xml
          cat << 'EOF' > android-app/app/src/main/res/drawable/menu_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#EE1A1A2E" />
              <corners android:radius="12dp" />
              <stroke android:width="1dp" android:color="#5500E5FF" />
          </shape>
          EOF

          # 10. bubble_bg.xml
          cat << 'EOF' > android-app/app/src/main/res/drawable/bubble_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#CC1A1A2E" />
              <stroke android:width="2dp" android:color="#FF00E5FF" />
          </shape>
          EOF

          # 11. ic_launcher.xml (بسيط جداً عشان يعدي البناء)
          cat << 'EOF' > android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black" />
              <foreground android:drawable="@android:drawable/ic_menu_manage" />
          </adaptive-icon>
          EOF

          # 12. activity_main.xml
          cat << 'EOF' > android-app/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:padding="32dp" android:gravity="center_vertical"
              android:background="#FF0D0D1A" android:layoutDirection="rtl">
              <TextView android:id="@+id/status_text" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:text="@string/status_denied"
                  android:textColor="#DDDDDD" android:layout_marginBottom="24dp" />
              <Button android:id="@+id/btn_grant" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:text="@string/btn_grant" android:layout_marginBottom="12dp" />
              <Button android:id="@+id/btn_start" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:text="@string/btn_start" android:layout_marginBottom="12dp" />
              <Button android:id="@+id/btn_stop" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:text="@string/btn_stop" />
          </LinearLayout>
          EOF

          # 13. floating_bubble.xml
          cat << 'EOF' > android-app/app/src/main/res/layout/floating_bubble.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="56dp" android:layout_height="56dp">
              <ImageView android:layout_width="match_parent" android:layout_height="match_parent"
                  android:background="@drawable/bubble_bg" android:padding="12dp"
                  android:src="@android:drawable/ic_menu_manage" />
          </FrameLayout>
          EOF

          # 14. floating_menu.xml
          cat << 'EOF' > android-app/app/src/main/res/layout/floating_menu.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="300dp" android:layout_height="wrap_content"
              android:orientation="vertical" android:background="@drawable/menu_bg"
              android:padding="12dp" android:layoutDirection="rtl">
              <LinearLayout android:id="@+id/menu_drag_handle" android:layout_width="match_parent"
                  android:layout_height="40dp" android:orientation="horizontal"
                  android:gravity="center_vertical" android:background="#2200E5FF" android:paddingStart="8dp">
                  <TextView android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:text="@string/menu_title" android:textColor="#FF00E5FF" android:textStyle="bold" />
                  <Button android:id="@+id/btn_close" android:layout_width="36dp" android:layout_height="32dp"
                      android:text="×" android:textColor="#FFFF4444" android:background="@android:color/transparent" />
              </LinearLayout>
              <TextView android:id="@+id/label_alpha" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:text="@string/label_opacity" android:textColor="#DDDDDD" android:layout_marginTop="8dp" />
              <SeekBar android:id="@+id/seek_alpha" android:layout_width="match_parent" android:layout_height="wrap_content" />
              <Switch android:id="@+id/switch_esp" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:text="@string/switch_esp" android:textColor="#FFFFFF" />
              <Switch android:id="@+id/switch_aimbot" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:text="@string/switch_aimbot" android:textColor="#FFFFFF" />
              <TextView android:id="@+id/label_fov" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:text="@string/label_fov" android:textColor="#DDDDDD" />
              <SeekBar android:id="@+id/seek_fov" android:layout_width="match_parent" android:layout_height="wrap_content" />
              <TextView android:id="@+id/label_smoothing" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:text="@string/label_smoothing" android:textColor="#DDDDDD" />
              <SeekBar android:id="@+id/seek_smoothing" android:layout_width="match_parent" android:layout_height="wrap_content" />
              <Button android:id="@+id/btn_bone" android:layout_width="match_parent"
                  android:layout_height="44dp" android:text="@string/target_head" />
          </LinearLayout>
          EOF
          
          echo "Project structure generated successfully."

      - name: Setup Gradle Wrapper
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlphaXK-Tool-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
